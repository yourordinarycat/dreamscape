<!DOCTYPE html>
<html attr.lang="{Binding language}">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8">
  <title content="{Binding title}"></title>
  <meta name="author" attr.content="{Binding author}">

  <link attr.href="{StaticResource BasePageStyle}" rel="stylesheet">
  <link rel="icon" attr.href="{StaticResource FaviconIco}" sizes="32x32">
  <link rel="icon" attr.href="{StaticResource FaviconSvg}" type="image/svg+xml">
  <link rel="apple-touch-icon" attr.href="{StaticResource FaviconAppleTouch}">
</head>

<body>
  <main>
    <blg-article>
      <header>
        <h1 content="{Binding title}"></h1>
        <p>
          <time attr.datetime="{Binding publishDate}" content="{Binding publishDisplayDate}">
          </time>
          -
          <span content="{Binding author}"></span>
          -
          <a attr.href="{Destination index}">☆ dreamscape ☆</a>
        </p>
      </header>
    </blg-article>

    <hr>
  </main>

  <footer>
    <blg-previous-post>
      <a attr.href="{Binding url}" attr.title="{Binding title}">
        <small>previous post</small>
        <p content="{Binding title}"></p>
      </a>
    </blg-previous-post>

    <blg-next-post>
      <a attr.href="{Binding url}" attr.title="{Binding title}">
        <small>next post</small>
        <p content="{Binding title}"></p>
      </a>
    </blg-next-post>
  </footer>
</body>

</html>
